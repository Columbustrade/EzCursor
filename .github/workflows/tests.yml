name: Kiểm thử

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài thư viện
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          pip install pillow customtkinter pytest
      - name: Chạy kiểm thử (Windows giả lập, màn hình ảo)
        run: xvfb-run -a python -m pytest tests -q
